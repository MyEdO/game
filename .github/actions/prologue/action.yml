name: Prologue
description: >-
  Prologue de chaque job vérifiant de ci.yml — Node, le classement du push (#1738), npm ci, puis les gates
  sautées du push (#4903 L4).
  Posé APRÈS actions/checkout (une action locale se lit dans l'arbre du runner).

outputs:
  produit:
    description: >-
      Classement du push (scripts/gates/classerPush.mjs) — `false` sur un push documentaire ; toute
      autre valeur, vide comprise, fait jouer les steps conditionnés (fail-closed).
    value: ${{ steps.classer.outputs.produit }}
  sautees:
    description: >-
      Gates sautées du push (scripts/gates/sauteesDuPush.mjs), sous la forme ` <nom> <nom> … ` ; un output vide ne
      saute rien (fail-closed).
    value: ${{ steps.sautees.outputs.sautees }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        check-latest: true
        cache: npm
    # AVANT `npm ci` : la fermeture des imports du classement n'atteint aucun paquet (garde
    # scripts/gates/classerPush.test.mjs).
    - id: classer
      shell: bash
      env:
        BASE: ${{ github.event.merge_group.base_sha }}
        SHA: ${{ github.sha }}
      run: node scripts/gates/classerPush.mjs >> "$GITHUB_OUTPUT"
    - id: install
      shell: bash
      run: npm ci
    # APRÈS `npm ci` : les gates sautées se lisent dans `ECRIT_LU` (scripts/gates/toutes.mjs), qui atteint des paquets.
    - id: sautees
      shell: bash
      env:
        BASE: ${{ github.event.merge_group.base_sha }}
        SHA: ${{ github.sha }}
      run: node scripts/gates/sauteesDuPush.mjs >> "$GITHUB_OUTPUT"
