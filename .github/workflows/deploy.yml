name: Déploiement

# Un export Web Godot par lancement manuel. dev /dev/ : cgauche/dev, main à la racine.
# jeu /jeu/ : cgauche/cgauche.github.io, répertoire jeu/ sur main.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Cible : dev (Godot de développement) ou jeu (Godot de production)"
        type: choice
        options: [dev, jeu]
        default: dev

concurrency:
  group: deploy-${{ inputs.cible }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la ref de production
        if: ${{ inputs.cible == 'jeu' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::La cible jeu se construit depuis main."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: ./.github/actions/caches-3d
      - name: Construire l’export Web Godot
        run: npm run godot:web
      # PROD_DEPLOY_KEY : clé privée SSH dont la publique est une deploy key en écriture sur cgauche/cgauche.github.io
      - if: ${{ inputs.cible == 'jeu' }}
        uses: actions/checkout@v4
        with:
          repository: cgauche/cgauche.github.io
          ssh-key: ${{ secrets.PROD_DEPLOY_KEY }}
          path: prod
      - name: Publier jeu
        if: ${{ inputs.cible == 'jeu' }}
        run: |
          set -e
          rm -rf prod/jeu
          mkdir -p prod/jeu
          cp -r dist/godot/. prod/jeu/
          cd prod
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu
          if git diff --cached --quiet; then
            echo "Rien à publier"
          else
            git commit -m "deploy: jeu WFRP (${GITHUB_SHA::8})"
            git push
          fi
      # DEV_DEPLOY_KEY : clé privée SSH dont la publique est une deploy key en écriture sur cgauche/dev
      - if: ${{ inputs.cible == 'dev' }}
        uses: actions/checkout@v4
        with:
          repository: cgauche/dev
          ssh-key: ${{ secrets.DEV_DEPLOY_KEY }}
          path: site
      # Un commit orphelin poussé de force : le dépôt ne garde que le dernier déploiement. `.nojekyll` : Pages sert les
      # fichiers tels quels, sans construction Jekyll.
      - name: Publier dev
        if: ${{ inputs.cible == 'dev' }}
        run: |
          set -e
          cd site
          git checkout --orphan deploiement
          git rm -rfq .
          cp -r ../dist/godot/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: dev WFRP (${GITHUB_SHA::8})"
          git push --force origin deploiement:main
