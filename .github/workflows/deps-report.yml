name: Rapport de dépendances

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imports:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cas: main, ref: main, lot: 1 }
          - { cas: main, ref: main, lot: 2 }
          - { cas: sans-fils, ref: '', lot: 1 }
          - { cas: sans-fils, ref: '', lot: 2 }
          - { cas: sans-fils, ref: '', lot: 3 }
          - { cas: temoin, ref: '', lot: 1 }
    name: imports (${{ matrix.cas }} ${{ matrix.lot }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/caches-3d
      - run: npm run pont:godot
      - run: npm run godot:sonde
      - name: Imports répétés
        run: |
          G=$(ls ~/.cache/wfrp-godot/4.7-stable/Godot_v4.7-stable_linux.x86_64)
          git log --oneline -1
          plantes=0
          for i in $(seq 1 20); do
            rm -rf /tmp/copie; cp -r hotes/godot/projet /tmp/copie; rm -rf /tmp/copie/.godot
            if [ "${{ matrix.cas }}" = sans-fils ]; then
              sed -i 's/^\[gui\]$/[editor]\n\nimport\/use_multiple_threads=false\n\n[gui]/' /tmp/copie/project.godot
              grep -c 'use_multiple_threads=false' /tmp/copie/project.godot > /dev/null
            fi
            code=0; "$G" --headless --path /tmp/copie --import > /tmp/import-$i.log 2>&1 || code=$?
            echo "import $i : code $code"
            if [ "$code" != 0 ]; then
              plantes=$((plantes+1))
              grep -E 'reimport|ERROR' /tmp/import-$i.log | tail -4 | cut -c1-200
              tail -12 /tmp/import-$i.log | cut -c1-200
            fi
          done
          echo "plantés : $plantes sur 20"
