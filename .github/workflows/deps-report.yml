name: Rapport de dépendances

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/caches-3d
      - run: npm run pont:godot
      - run: npm run godot:sonde
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-vulkan-drivers libxcursor1 libxinerama1 libxrandr2 libxi6
      - run: npm run godot:rendus
      - if: ${{ !cancelled() }}
        run: npm run godot:rendus
      - if: ${{ !cancelled() }}
        run: free -m; nproc; df -h /tmp; ls -la ~/.config/godot ~/.local/share/godot ~/.cache/godot 2>&1 | head -40; sudo dmesg | tail -30

  bureau:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/caches-3d
      - run: npm run godot:bureau
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bureau-${{ matrix.os }}
          path: dist/bureau
