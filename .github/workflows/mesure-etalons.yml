name: Mesure du banc des étalons

# Mesure jetable (#3935, lot 0) : l'écart de rendu entre le conteneur qui a posé les étalons et un runner, et la
# durée du banc sur un runner. Cette branche ne fusionne pas.
on:
  push:
    branches: ['claude/project-thread-k424a0']

permissions:
  contents: read

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/caches-3d
      - name: Machine
        run: nproc && free -m && lscpu | grep -E 'Model name|Flags' | cut -c1-400
      - name: Chromium du conteneur (Playwright 1.63.0, build 1243)
        run: |
          date +%s > /tmp/t0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          ls "$HOME/.cache/ms-playwright"
          echo "installation du navigateur : $(( $(date +%s) - $(cat /tmp/t0) )) s"
      - name: Export Web
        run: |
          date +%s > /tmp/t0
          node hotes/godot/construire.mjs --export --sortie dist/godot
          echo "export : $(( $(date +%s) - $(cat /tmp/t0) )) s"
      - name: Banc, deux processus, sans rapport
        id: banc
        continue-on-error: true
        run: |
          date +%s > /tmp/t0
          mapfile -t NOMS < <(ls hotes/godot/etalons/planches/*.json | xargs -n1 basename | sed 's/\.json$//')
          A=(); B=()
          for i in "${!NOMS[@]}"; do if (( i % 2 )); then B+=(--planche "${NOMS[$i]}"); else A+=(--planche "${NOMS[$i]}"); fi; done
          node hotes/godot/etalons.mjs --web dist/godot "${A[@]}" > /tmp/banc-a.log 2>&1 &
          PA=$!
          CB=0; node hotes/godot/etalons.mjs --web dist/godot "${B[@]}" > /tmp/banc-b.log 2>&1 || CB=$?
          CA=0; wait $PA || CA=$?
          cat /tmp/banc-a.log /tmp/banc-b.log
          echo "banc : $(( $(date +%s) - $(cat /tmp/t0) )) s, codes $CA et $CB"
          test "$CA" = 0 && test "$CB" = 0
      - name: Seconde passe sur le même runner, avec les rendus de quatre planches
        continue-on-error: true
        run: |
          date +%s > /tmp/t0
          node hotes/godot/etalons.mjs --web dist/godot --planche lieu --planche attaque --planche voyage-jets --planche fiche-du-heros --rapport /tmp/rapport
          echo "quatre planches avec rapport : $(( $(date +%s) - $(cat /tmp/t0) )) s"
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-etalons
          path: /tmp/rapport
      - name: Verdict
        run: test "${{ steps.banc.outcome }}" = success
