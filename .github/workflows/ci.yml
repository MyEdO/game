name: CI

on:
  push:
    branches: ['chantier/**', 'feat/**']
  merge_group:
    types: [checks_requested]

# `main` n'avance que par la FILE DE FUSION (#2178, scripts/ops/ruleset-main.mjs) : ses checks requis
# se jouent sur le commit de file (`merge_group`), qui est le sha poussé sur `main` — aucun run sur
# `push` de `main`. Le `push` d'une branche de travail attache ses checks à la tête de sa PR
# (troubleshooting-required-status-checks.md:55-58), sans déclencheur `pull_request`.
#
# Un run par ref sur une branche de travail : un push qui en suit un autre ANNULE le run en vol, seule
# la tête compte. Un run par PR en file : une entrée que GitHub reconstruit après un rouge devant elle
# change de ref (`gh-readonly-queue/main/pr-<N>-<sha>`) et garde son message de commit (`Merge pull
# request #<N> from …`, `PARAMETRES_DU_DEPOT`, scripts/ops/ruleset-main.mjs) ; le run de l'ancienne ref,
# que GitHub laisse courir, est ANNULÉ et rend ses runners (#3412 : la course 43446957195 en a tenu 10
# jusqu'à 12 min après la reconstruction de son entrée). `toJSON` tient le message sur une ligne.
#
# DEUX COURSES (#3412, arbitrage du 2026-11-05 au ticket) : la course de FILE (`merge_group`) joue TOUTES
# les gates, celle de BRANCHE (`push`) n'en joue qu'un sous-ensemble — le job `branche` : `typecheck`,
# puis `test:perimetre` : lint des fichiers touchés et tests dérivés du diff sous son budget. Le
# partage se fait au niveau du STEP : le checkout et le prologue de chaque job portent la condition
# d'événement de sa course (`SI_DE_COURSE`, scripts/gates/gatesDeCi.mjs), et chaque gate attend
# `steps.prologue.outcome == 'success'` ; hors de sa course, un job saute tous ses steps et rend
# « Success » en quelques secondes. Ses checks restent REQUIS des deux côtés : le ruleset les exige
# tous sur le commit de file, et `branche` bloque l'entrée en file tant qu'il n'est pas vert. Un rouge
# hors du périmètre dérivé se découvre en file, qui éjecte la PR (`causeDEjection`,
# scripts/ops/etapesDuTrain.mjs).
concurrency:
  group: ci-${{ toJSON(github.event.merge_group.head_commit.message || github.ref) }}
  cancel-in-progress: true

# UN JOB VÉRIFIANT = UN GROUPE de gates qui tourne en PARALLÈLE des autres (#2178) ; le rejeu local
# `npm run gates` en DÉRIVE ses lanes (`lanesDeCi`, scripts/gates/toutes.mjs) : un job par lane, sauf
# ceux que `LANE_LOCALE_DE_JOB` (scripts/gates/gatesDeCi.mjs) rattache à la lane d'un autre, et la
# table `ECRIT_LU` y verrouille qu'aucun groupe n'écrit ce qu'un autre lit (`conflitsEntreLanes`). Le
# job matrice `suite` joue la gate `test` en parties disjointes ; le rejeu local la joue entière.
#
# AUCUN job vérifiant ne porte de `needs:` ni d'`if:` de niveau job : « A job that is skipped will
# report its status as "Success". It will not prevent a pull request from merging, even if it is a
# required check. » (docs GitHub, control-jobs-with-conditions.md:42) ; « A job depends on a failed
# job | The dependent job is skipped and may not block merging » (troubleshooting-required-status-
# checks.md:78). Garde : `scripts/ops/ruleset-main.test.mjs`, qui verrouille aussi la condition
# d'événement du checkout et du prologue de chaque job (`SI_DE_COURSE`).
#
# `timeout-minutes` sur CHAQUE job, jamais sur un step : `TIMEOUT_JOB_MINUTES`
# (scripts/gates/gatesDeCi.mjs), garde `scripts/ops/ruleset-main.test.mjs`.
#
# `fetch-depth: 0` sur chaque checkout vérifiant : `test:hooks` interroge l’HISTOIRE (soldes de
# fermeture depuis le 2026-08-01, commit fondateur d’un solde « corrigé par <sha> ») ;
# `docs:build` la lit (scripts/docs/build-doctrines.mjs, scripts/docs/check-plans-anchors.mjs) ;
# `npm test` aussi (src/data/regles-migration-fidelite.test.ts) ; le classement du push (#1738) lit
# `merge-base origin/main`, ou `merge_group.base_sha` sur un commit de file. Dans le clone superficiel
# par défaut (depth 1), `git log --since` est vide et les shas anciens sont absents.
#
# Le PROLOGUE de chaque job vérifiant est l'action composite `.github/actions/prologue` : Node, le
# CLASSEMENT du push (#1738, scripts/gates/classerPush.mjs), `npm ci`, puis les GATES SAUTÉES du push
# (#4903 L4, scripts/gates/sauteesDuPush.mjs). POLARITÉ FAIL-CLOSED : un step de gate, ou au service d'une
# gate (`CI_SEULEMENT_DE_GATE`, `actions/setup-python`), teste
# `!contains(steps.prologue.outputs.sautees, ' <gate> ')` ; les autres steps conditionnés testent
# `steps.prologue.outputs.produit != 'false'` ; un output vide, absent ou en erreur fait JOUER. Une gate
# saute quand chaque fichier du push est hors de ce qu'elle LIT (`ECRIT_LU`, scripts/gates/toutes.mjs) :
# documentaire quand son `lit` ne chevauche aucun chemin documentaire, dans un dossier de zone hors de
# `src/` quand elle déclare ses `zones` et ne le lit pas ; `scripts/gates/classerPush.test.mjs` confronte
# cette DÉCISION à cette MESURE, dans les deux sens.
#
# Chaque gate se joue même si une précédente de son job est ROUGE : sans `!cancelled()`, le premier
# rouge SKIPPE les suivants et un run ne rend qu'un verdict (runs 33717131460 et 33719038837). Le job
# reste rouge dès qu'un step l'est — jamais de `continue-on-error`, qui rendrait le step VERT. Seul
# l'échec du prologue coupe la suite (`steps.prologue.outcome`) : rien ne s'y jouerait.
jobs:
  # La course de BRANCHE (`JOB_DE_BRANCHE`, scripts/gates/gatesDeCi.mjs ; en tête de ce fichier), hors du
  # rejeu local (`JOBS_HORS_REJEU_LOCAL`). `test:perimetre` lit les durées par fichier de la dernière course
  # de file réussie (`rapatrierDureesCi`, scripts/test/dureesCi.mjs) par `gh` : `GH_TOKEN` et
  # `actions: read`. Sa base est la base commune avec `origin/main`, que `fetch-depth: 0` porte.
  branche:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:perimetre
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Les LECTEURS de docs/ et docs/raw/.
  # `comptes:plage` (#2705, scripts/guards/comptes-plage.mts) : la porte des volets SOUS LA PORTE sur la plage
  # `merge-base origin/main..HEAD` — aucun compte ne monte, aucun site n'y naît, aucun plancher ne cède, à détecteur
  # constant ; puis l'inventaire de la dette que la donnée révèle (#3021), hors de la porte, au résumé du job ; sautée
  # sur un push documentaire, qui ne touche aucune donnée. Elle se joue ici pour répartir la durée de la course de
  # file entre les jobs (#3412).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run docs:build
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run agents:check
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:raw
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-refs ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-refs
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-code-refs ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-code-refs
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-ancres ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-ancres
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-folio-continuity ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-folio-continuity
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-source-tables ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-tables
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-source-format ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-format
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-source-puces ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-puces
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' raw:check-renvois ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-renvois
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' comptes:plage ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run comptes:plage
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # `test:docs` hors du chemin critique de `docs` (#2178), sur l'arbre du COMMIT, sans `docs:build` :
  # un test qui lit une cible PURE la rend (`renduDe`, `rendreCible` de scripts/docs/build-all.mjs).
  # `test:corpus-isole`, `test:ops` et `test:runner` n'écrivent pas dans l'arbre : ils se jouent
  # ici pour répartir la durée de la course de file entre les jobs (#3412), et le rejeu local les porte dans la lane
  # `docs` (`LANE_LOCALE_DE_JOB`).
  docs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:docs
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:corpus-isole
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:ops
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:runner
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Lectures du graphe TypeScript : typecheck, chargement des modules en premier, pont Godot et lint. `noyau:chargement`
  # se joue ici pour répartir la durée de la course de file entre les jobs (#3412, #5037).
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:agents
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run deps:unused
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' test:recette ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:recette
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' typecheck ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run typecheck
      # `noyau:chargement` (#3058, scripts/guards/chargement-en-premier.mjs) : chaque module du noyau, du moteur, de la
      # donnée, des feuilles, des hôtes (hotes/ compris) et des scénarios chargé EN PREMIER dans un graphe neuf de
      # Vite.
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' noyau:chargement ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run noyau:chargement
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' pont:godot ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run pont:godot
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' server:typecheck ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm --prefix server ci
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' server:typecheck ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run server:typecheck
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # L'hôte Godot et la chaîne 3D en trois jobs menés de front, hors du chemin critique de `types` (#3412), dans la lane
  # locale `types` (`LANE_LOCALE_DE_JOB`). Chacun dépose les modèles, les textures et l'éditeur qu'il lit
  # (`deposerLesAssets`, hotes/godot/construire.mjs), depuis les caches de la chaîne 3D qui le précèdent.
  # `personnage-3d:tests` (#3145) : `scripts/personnage-3d/tests.py` dans le venv épinglé de
  # `scripts/personnage-3d/environnement.mjs`, sous le CPython de son `PYTHON` (marqueur `python_version` de
  # requirements.txt), après `godot:sonde`, qui tire dans `CACHE_DES_MODELES` les GLB épinglés que `test_element.py` lit.
  # Le cache de pip est keyé par requirements.txt ; le venv, lié à l'interpréteur du runner, ne se cache pas.
  # `godot:coop` (#3009) : le relay local (`server/` installé pour lui seul) et la coop jouée par deux processus Godot.
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - name: Godot — scripts et recettes autonomes
        if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:sonde ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run godot:sonde
      - name: Export Web Godot
        if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:web ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run godot:web
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:coop ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm --prefix server ci
      - name: Godot — coop à deux processus
        if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:coop ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run godot:coop
      - id: python-3d
        if: ${{ !contains(steps.prologue.outputs.sautees, ' personnage-3d:tests ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: node --input-type=module -e "import { PYTHON } from './scripts/personnage-3d/environnement.mjs'; console.log('version=' + PYTHON)" >> "$GITHUB_OUTPUT"
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' personnage-3d:tests ') && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-3d.outputs.version }}
          cache: pip
          cache-dependency-path: scripts/personnage-3d/requirements.txt
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' personnage-3d:tests ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run personnage-3d:tests
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # `godot:rendus` (#3951) : les recettes rendues, en rendu réel sous chacun des deux rendus (Forward+ et
  # compatibilité), sur un écran virtuel et le rendu logiciel de Mesa.
  godot-rendus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deux fils de rastérisation Mesa par recette, deux recettes de front sur quatre vCPU.
      LP_NUM_THREADS: '2'
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:rendus ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-vulkan-drivers libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Godot — recettes rendues sous les deux rendus
        if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:rendus ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run godot:rendus
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # `godot:recette` (#3945) : les jeux `combat`, `editeur` et `compendium` des recettes natives de l'hôte Godot
  # (`lot-de-recettes.mjs --natif`), sans export ni navigateur ; `canari.yml` joue le lot natif entier.
  # `roguelite:construire` puis `roguelite:recette` (#4929) : le roguelite construit sous `dist/roguelite/`, et son lot de
  # recettes (`projets/roguelite/recette/lot.mjs`) dans le Chromium épinglé (scripts/recette/navigateur.mjs), la page
  # servie par interception, sans serveur.
  godot-recette:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - name: Godot — recettes natives
        if: ${{ !contains(steps.prologue.outputs.sautees, ' godot:recette ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run godot:recette
      - name: Roguelite — construction
        if: ${{ !contains(steps.prologue.outputs.sautees, ' roguelite:construire ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run roguelite:construire
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' roguelite:recette ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Roguelite — recettes
        if: ${{ !contains(steps.prologue.outputs.sautees, ' roguelite:recette ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run roguelite:recette
      # Les captures d'une recette rouge, dont les images comparées à la référence (`dist/roguelite-recette/images/`).
      - if: ${{ failure() && steps.prologue.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: roguelite-recette
          path: dist/roguelite-recette
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # `test:hooks` hors du chemin critique de `types` (#2178), sous garde des écritures d'arbre (#2489).
  # `livraison:plage` (#2328, scripts/guards/livraison-plage.mjs) : la porte de PUBLICATION des
  # résolutions de fusion de `merge-base origin/main..HEAD` ; elle lit les soldes de `.claude/` dans
  # l'histoire, elle n'est jamais sautée.
  types-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:hooks
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run livraison:plage
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # `test:corpus`, hors du chemin critique de `types` et de `types-hooks` (#3412) : ces jobs et ceux de Godot se
  # partagent la lane locale `types` (`LANE_LOCALE_DE_JOB`).
  # `mods:check` (#2278, scripts/mods/verifier.mjs) : la garde des mods Claude Code de .claude/skills/,
  # jouée sur des copies sous os.tmpdir() ; son `lit` chevauche `.claude/`, elle n'est jamais sautée.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:corpus
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run mods:check
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # La suite : la seule gate à saturer la machine, en parties DISJOINTES dont l'union est la suite
  # (`WFRP_TEST_PARTIE`, scripts/test/run.mjs), une par job de la matrice. K = la longueur de la liste.
  # `fail-fast: false` : un rouge n'annule pas ses sœurs (`matriceDe`, scripts/gates/gatesDeCi.mjs).
  suite:
    name: suite ${{ matrix.partie }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partie: [1, 2, 3]
    env:
      WFRP_TEST_PARTIE: ${{ matrix.partie }}/${{ strategy.job-total }}
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - if: ${{ !contains(steps.prologue.outputs.sautees, ' test ') && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm test
      # Pas de step `test:map` : `scripts/map/**/*.test.ts` est dans le `test.include` de
      # `vitest.config.ts`, donc `npm test` joue déjà `scripts/map/check.test.ts`. Les gardes qui
      # scannent les suites jouées lisent les racines à la source de ce `test.include`
      # (`scripts/guards/lib/racinesDeLaSuite.mjs`, `fichiersDeLaSuite` de `suiteVitest.mjs`). Le
      # script `test:map` reste dans package.json : il sert à jouer CE dossier seul.
      # Filet des écrivains par nature (`genererCode` du `buildStart` de vitest.config.ts).
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Les migrations de donnée sont REJOUABLES : rejouées sur l'arbre courant, elles ne réécrivent
  # RIEN. Job DÉDIÉ : il écrit dans l'arbre de SON runner, jamais dans celui d'un job de gates.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        if: ${{ github.event_name == 'merge_group' }}
        uses: ./.github/actions/prologue
      - name: Rejeu des migrations (idempotence de la donnée)
        if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run migrations:replay
      # `+1 entrée → aucun rouge` (#1812) : un compte d'entrées gelé dans une migration DÉJÀ JOUÉE
      # ferait payer un recalage à chaque donnée ajoutée. La porte fabrique l'ajout sur un export
      # JETABLE — l'arbre du runner n'est pas écrit — et rejoue tout.
      - name: Rejeu en CROISSANCE (+1 entrée ne coûte rien)
        if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run migrations:replay:croissance
