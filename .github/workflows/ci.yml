name: CI

on:
  push:
    branches: [main, 'chantier/**', 'feat/**']
  pull_request:

# Un run par ref. Sur une branche de travail, un push qui en suit un autre ANNULE le run en vol :
# seule la tête compte, et c'est elle que le fast-forward vers `main` exige verte. Sur `main`, rien
# n'est annulé — le job `fermetures` de la plage précédente ferme des tickets et ne se rejoue pas
# (#1776).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# UN JOB VÉRIFIANT = UN GROUPE de gates qui tourne en PARALLÈLE des autres (#2178) ; le rejeu local
# `npm run gates` en DÉRIVE ses lanes (`lanesDeCi`, scripts/gates/toutes.mjs), et la table
# `ECRIT_LU` y verrouille qu'aucun groupe n'écrit ce qu'un autre lit (`conflitsEntreLanes`).
#
# AUCUN job vérifiant ne porte de `needs:` ni d'`if:` de niveau job : « A job that is skipped will
# report its status as "Success". It will not prevent a pull request from merging, even if it is a
# required check. » (docs GitHub, control-jobs-with-conditions.md:42) ; « A job depends on a failed
# job | The dependent job is skipped and may not block merging » (troubleshooting-required-status-
# checks.md:78). Garde : `scripts/ops/ruleset-main.test.mjs`.
#
# `timeout-minutes` sur CHAQUE job, jamais sur un step : `TIMEOUT_JOB_MINUTES`
# (scripts/gates/gatesDeCi.mjs), garde `scripts/ops/ruleset-main.test.mjs`.
#
# `fetch-depth: 0` sur chaque checkout vérifiant : `test:hooks` interroge l’HISTOIRE (soldes de
# fermeture depuis le 2026-08-01, commit fondateur d’un solde « corrigé par <sha> ») ;
# `docs:check:tout` la lit (scripts/docs/build-doctrines.mjs, scripts/docs/check-plans-anchors.mjs) ;
# `npm test` aussi (src/data/regles-migration-fidelite.test.ts) ; et le classement du push (#1738)
# lit `merge-base origin/main`. Dans le clone superficiel par défaut (depth 1), `git log --since` est
# vide et les shas anciens sont absents.
#
# Le PROLOGUE de chaque job vérifiant est l'action composite `.github/actions/prologue` : Node, le
# CLASSEMENT du push (#1738, scripts/gates/classerPush.mjs) puis `npm ci`. POLARITÉ FAIL-CLOSED :
# chaque step conditionné teste `steps.prologue.outputs.produit != 'false'`, donc un output vide,
# absent ou en erreur fait JOUER. Un step joue toujours dès que ce qu'il LIT (`ECRIT_LU`,
# scripts/gates/toutes.mjs) chevauche un chemin documentaire ; `scripts/gates/classerPush.test.mjs`
# confronte cette DÉCISION à cette MESURE, dans les deux sens.
#
# Chaque gate se joue même si une précédente de son job est ROUGE : sans `!cancelled()`, le premier
# rouge SKIPPE les suivants et un run ne rend qu'un verdict (runs 33717131460 et 33719038837). Le job
# reste rouge dès qu'un step l'est — jamais de `continue-on-error`, qui rendrait le step VERT. Seul
# l'échec du prologue coupe la suite (`steps.prologue.outcome`) : rien ne s'y jouerait.
jobs:
  # Les LECTEURS de docs/ et docs/raw/, et `build` (`gen && vite build`, qui n'écrit ni docs/ ni
  # docs/raw/).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        uses: ./.github/actions/prologue
      # Chaque dérivé committé (`GENERATORS`, scripts/docs/build-all.mjs) REJOUÉ EN ENTIER en `--check` :
      # la fraîcheur par le pied est aveugle à la plateforme qui a rendu un corps (#1801). PREMIÈRE
      # gate du job : `npm run build` passe par `vite.config.ts`, dont `buildStart` appelle `genAll()`
      # et réécrit les `*.generated.ts` ; jouée après lui, elle vérifierait un registre déjà réécrit.
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run docs:check:tout
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run agents:check
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:docs
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run build
      # Pied « sources-empreinte » de chaque doc dérivé confronté aux blobs de l'INDEX (#1679 L1b).
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run docs:empreinte
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:raw
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-refs
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-code-refs
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-ancres
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-folio-continuity
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-tables
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-format
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-source-puces
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run raw:check-renvois
      # Filet des écrivains par nature (`genAll()` de `build`) : aucun step ne laisse l'arbre du runner
      # différent du commit. Classé `CI_SEULEMENT` (scripts/gates/gatesDeCi.mjs).
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Lectures du même graphe TypeScript et gates courtes. `test:hooks` n'y fait aucune écriture d'arbre
  # SUIVIE (sa seule écriture réelle, le journal gitignoré, est en `ecritFerme` d'`ECRIT_LU`).
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        uses: ./.github/actions/prologue
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:agents
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:hooks
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:ops
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:runner
      - if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run deps:unused
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run test:recette
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run lint
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm --prefix server ci
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run server:typecheck
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # La suite : la seule gate à saturer la machine, seule dans son job.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        uses: ./.github/actions/prologue
      - if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm test
      # Pas de step `test:map` : `scripts/map/**/*.test.ts` est dans le `test.include` de
      # `vite.config.ts`, donc `npm test` joue déjà `scripts/map/check.test.ts`. Les gardes qui
      # scannent les suites jouées lisent les racines à la source de ce `test.include`
      # (`scripts/guards/lib/racinesDeLaSuite.mjs`, `fichiersDeLaSuite` de `suiteVitest.mjs`). Le
      # script `test:map` reste dans package.json : il sert à jouer CE dossier seul.
      # Filet des écrivains par nature (`genAll()` de la suite).
      - name: Arbre inchangé
        if: ${{ !cancelled() && steps.prologue.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Les migrations de donnée sont REJOUABLES : rejouées sur l'arbre courant, elles ne réécrivent
  # RIEN. Job DÉDIÉ : il écrit dans l'arbre de SON runner, jamais dans celui d'un job de gates.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prologue
        uses: ./.github/actions/prologue
      - name: Rejeu des migrations (idempotence de la donnée)
        if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run migrations:replay
      # `+1 entrée → aucun rouge` (#1812) : un compte d'entrées gelé dans une migration DÉJÀ JOUÉE
      # ferait payer un recalage à chaque donnée ajoutée. La porte fabrique l'ajout sur un export
      # JETABLE — l'arbre du runner n'est pas écrit — et rejoue tout.
      - name: Rejeu en CROISSANCE (+1 entrée ne coûte rien)
        if: ${{ steps.prologue.outputs.produit != 'false' && !cancelled() && steps.prologue.outcome == 'success' }}
        run: npm run migrations:replay:croissance

  # Un ticket se ferme quand son correctif est PUBLIÉ, jamais au commit local : AUCUN hook local ne
  # ferme de ticket, c'est ce job qui le fait (#1685 avait été fermé par 8b52f3a55 avant que ce commit
  # n'atteigne `main` — revue de palier n°3, 2026-09-04, écart 10). Ses `needs:` sont TOUS les jobs
  # vérifiants (`contextesRequis`, scripts/gates/gatesDeCi.mjs ; garde
  # `scripts/ops/ruleset-main.test.mjs`) : un job dont un `needs:` a échoué est SAUTÉ (docs GitHub,
  # troubleshooting-required-status-checks.md:78), donc aucun ticket ne se ferme sur une course rouge.
  fermetures:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docs, types, suite, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # L'histoire complète : le script lit les MESSAGES de la plage poussée et le solde que chaque
      # commit EMPORTE (`git show <sha>:.claude/soldes/<N>.md`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fermer les tickets soldés par la plage poussée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$BEFORE" in *[!0]*) ;; *) BEFORE="$(git rev-parse "$SHA^")" ;; esac
          node scripts/ops/fermer-depuis-main.mjs "$BEFORE..$SHA"
