name: Canari

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# CHAQUE mesure joue, et le VERDICT est agrégé par un seul step. C'est la différence avec `ci.yml`,
# qui n'a PAS le droit d'utiliser `continue-on-error` : là-bas, chaque step est son propre verdict et
# un `continue-on-error` rendrait le step VERT ; le patron y est `if: ${{ !cancelled() }}`, qui fait
# jouer la gate suivante sans rien blanchir. Ici, le canari veut un rapport HEBDOMADAIRE : chaque
# mesure porte donc `continue-on-error: true` + un `id`, et le step « Résumé » les relit toutes, les
# poste dans l'issue survivante, puis ÉCHOUE si l'une est rouge. Sans cela, le premier rouge coupait
# le job : 17 à 22 steps SKIPPÉS par run, mesurés sur les 5 derniers canaris (tous rouges).
#
# Les vulnérabilités ne font plus échouer le canari par elles-mêmes : `npm audit --audit-level=high`
# rendait 1 sur un stock connu et figé (4 des 5 derniers rouges), et un rouge permanent ne mesure
# plus rien. C'est `scripts/ops/audit-stock.mjs` qui juge, sur l'ÉCART au stock daté.

# Un step sans `shell` tourne sous `bash -e`, SANS pipefail : `mesure | tee` y prend le code du `tee`.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` : `test:hooks` et `ops:fermetures-non-citees` interrogent l'HISTOIRE (voir ci.yml) — le
      # clone superficiel par défaut rendrait `git log --since` vide et les cliquets décoratifs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - id: install
        run: npm ci

      # Produit les cibles pures de `GENERATORS` (#2203). « Arbre inchangé » contrôle ensuite
      # l'intégrité des fichiers suivis, dans le même ordre que `ci.yml`.
      - id: docs-build
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run docs:build
      - id: agents-check
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run agents:check
      - id: test-agents
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:agents
      - id: test-hooks
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:hooks
      - id: test-ops
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ops
      - id: test-docs
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:docs
      - id: test-recette
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:recette
      - name: Idempotence des adaptateurs agents
        id: agents-idempotence
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run agents:sync
          destinations=$(node --input-type=module -e "const { DESTINATIONS } = await import('./scripts/agents/compat-core.mjs'); console.log(DESTINATIONS.join(' '))")
          git diff --exit-code -- $destinations
      - id: typecheck
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - id: lint
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/caches-3d
      - id: test
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      # Le seul volet des plans datés qui exige le réseau : un `Ticket:` vaut si au moins une issue ancrée
      # est OUVERTE et cite le chemin du plan (corps ou commentaire) ; sinon le plan est exécuté ou
      # l'ancre n'est pas revendiquée (#3028). La garde liste elle-même les issues ancrées (`--ancres`,
      # même parseur que son SENS 1) : on ne lit que celles-là, corps puis commentaires paginés.
      - name: Plans datés — ancre Ticket OUVERTE et revendiquée
        id: plans-dates
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/docs/check-plans-anchors.mjs --ancres > /tmp/ancres.txt
          while read -r n; do
            gh api "repos/{owner}/{repo}/issues/$n" < /dev/null > /tmp/issue.json
            [ "$(jq -r .state /tmp/issue.json)" = open ] || continue
            { jq -r '.body // ""' /tmp/issue.json
              gh api --paginate "repos/{owner}/{repo}/issues/$n/comments?per_page=100" --jq '.[].body' < /dev/null
            } | jq -Rs --argjson n "$n" '{number: $n, texte: .}'
          done < /tmp/ancres.txt | jq -s '.' > /tmp/issues-ancrees.json
          node scripts/docs/check-plans-anchors.mjs --online /tmp/issues-ancrees.json
      - id: test-raw
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:raw
      - id: raw-check-refs
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run raw:check-refs
      - id: raw-check-code-refs
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run raw:check-code-refs
      - id: server-install
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix server ci
      - id: server-typecheck
        continue-on-error: true
        if: ${{ !cancelled() && steps.server-install.outcome == 'success' }}
        run: npm run server:typecheck
      # La passe des maquettes (#4585, `npm run godot:maquettes`) : chaque état de chaque écran de
      # `hotes/godot/cibles/propositions/sources/maquettes/` rendu et relevé, 10 à 15 min, trop lourd pour le budget de
      # `ci.yml`. Le Chromium épinglé des planches (`EPINGLE`, `refusDuNavigateur`, que `rendre.mjs` vérifie), installé
      # ici par le Playwright des devDependencies sous le même `PLAYWRIGHT_BROWSERS_PATH` que les étalons.
      - id: godot-maquettes
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/chromium-epingle
        run: |
          npx playwright install chromium
          npm run godot:maquettes
      - if: ${{ !cancelled() && steps.godot-maquettes.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-maquettes
          path: dist/maquettes-passe
      # L'export Web de l'hôte Godot et le lot de ses recettes dans la page (#4007), puis le même lot en natif (#3945),
      # dont les jeux rendus sur un écran virtuel et les rechargements. `ci.yml` joue `combat`, `editeur` et `compendium`
      # en natif (`godot:recette`). Chrome est celui du runner.
      - id: godot-export
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node hotes/godot/construire.mjs --export --sortie "$RUNNER_TEMP/godot-web" --entree /hotes/godot/pont/entree-jeu-de-role.ts
      # Le banc des étalons (#3935) sur ce même export : chaque planche comparée au pixel à son étalon, dans le Chromium
      # que l'épingle nomme (`EPINGLE`, hotes/godot/planches.mjs), installé par le Playwright des devDependencies
      # sous son propre `PLAYWRIGHT_BROWSERS_PATH` posé au step : les recettes gardent le Chrome du runner.
      - id: godot-etalons
        continue-on-error: true
        if: ${{ !cancelled() && steps.godot-export.outcome == 'success' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/chromium-epingle
        run: |
          npx playwright install chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node hotes/godot/etalons.mjs --web "$RUNNER_TEMP/godot-web" --rapport "$RUNNER_TEMP/godot-etalons"
      - if: ${{ !cancelled() && steps.godot-etalons.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-etalons
          path: ${{ runner.temp }}/godot-etalons
      - id: godot-recettes
        continue-on-error: true
        if: ${{ !cancelled() && steps.godot-export.outcome == 'success' }}
        timeout-minutes: 300
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node hotes/godot/lot-de-recettes.mjs --web "$RUNNER_TEMP/godot-web" --captures "$RUNNER_TEMP/godot-recettes"
      - if: ${{ !cancelled() && steps.godot-recettes.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-recettes
          path: ${{ runner.temp }}/godot-recettes
      - id: godot-recettes-natives
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-vulkan-drivers libxcursor1 libxinerama1 libxrandr2 libxi6
          node hotes/godot/lot-de-recettes.mjs --natif --entree /hotes/godot/pont/entree-jeu-de-role.ts --captures "$RUNNER_TEMP/godot-recettes-natives"
      - if: ${{ !cancelled() && steps.godot-recettes-natives.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-recettes-natives
          path: ${{ runner.temp }}/godot-recettes-natives
      # La chaîne 3D reconstruite en entier (`WFRP_3D_TOUT=1`, scripts/personnage-3d/entrees.py, #3412) : la file de
      # fusion ne reconstruit que les éléments et les modèles de véhicule dont une entrée a changé.
      - id: python-3d
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --input-type=module -e "import { PYTHON } from './scripts/personnage-3d/environnement.mjs'; console.log('version=' + PYTHON)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.python-3d.outcome == 'success' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-3d.outputs.version }}
          cache: pip
          cache-dependency-path: scripts/personnage-3d/requirements.txt
      - id: personnage-3d-tout
        continue-on-error: true
        if: ${{ !cancelled() && steps.python-3d.outcome == 'success' }}
        env:
          WFRP_3D_TOUT: '1'
        run: |
          npm run godot:sonde
          npm run personnage-3d:tests
      # Les portes des presets touchés (#4814) jouées de bout en bout sur un élément publié remonté tel quel, celui du
      # preset le moins cher : le témoin et la mesure montent les mêmes octets, aucun écart neuf n'est attendu.
      - id: personnage-3d-portes
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node hotes/godot/asset/recuperer-modeles.mjs
          npm run personnage-3d:portes -- --local humanoide--tete--orc=hotes/godot/projet/modeles/humanoide--tete--orc.glb
      # Filet des écrivains par nature (`docs:build` et génération contrôlée par la suite), comme `ci.yml`.
      - name: Arbre inchangé
        id: arbre-inchange
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git status --porcelain && test -z "$(git status --porcelain)"

      # Les deux mesures d'ÉTAT (le dépôt npm, les fermetures GitHub)
      # écrivent leur rapport dans `$RUNNER_TEMP/canari` : le résumé les recolle dans le commentaire.
      # `defaults.run.shell: bash` lance chaque step sous `bash -eo pipefail` : le `tee` ne masque aucun exit.
      - name: Stock d'audit (racine + server)
        id: audit-stock
        continue-on-error: true
        if: ${{ !cancelled() && steps.server-install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/canari"
          node scripts/ops/audit-stock.mjs 2>&1 | tee "$RUNNER_TEMP/canari/audit.txt"
      - name: Fermetures hors commit
        id: fermetures
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/canari"
          node scripts/ops/fermetures-non-citees.mjs 2>&1 | tee "$RUNNER_TEMP/canari/fermetures.md"

      # VERDICT AGRÉGÉ : la seule place où `continue-on-error` se paie — le rapport est posté et le
      # job rougit si une mesure est rouge. `RESULTATS` nomme CHAQUE step de mesure : un step sans
      # `id`, ou absent d'ici, est rouge au test `scripts/ops/canari.test.mjs`.
      - name: Résumé du canari
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTATS: |
            install=${{ steps.install.outcome }}
            docs-build=${{ steps.docs-build.outcome }}
            agents-check=${{ steps.agents-check.outcome }}
            test-agents=${{ steps.test-agents.outcome }}
            test-hooks=${{ steps.test-hooks.outcome }}
            test-ops=${{ steps.test-ops.outcome }}
            test-docs=${{ steps.test-docs.outcome }}
            test-recette=${{ steps.test-recette.outcome }}
            agents-idempotence=${{ steps.agents-idempotence.outcome }}
            typecheck=${{ steps.typecheck.outcome }}
            lint=${{ steps.lint.outcome }}
            test=${{ steps.test.outcome }}
            plans-dates=${{ steps.plans-dates.outcome }}
            test-raw=${{ steps.test-raw.outcome }}
            raw-check-refs=${{ steps.raw-check-refs.outcome }}
            raw-check-code-refs=${{ steps.raw-check-code-refs.outcome }}
            server-install=${{ steps.server-install.outcome }}
            server-typecheck=${{ steps.server-typecheck.outcome }}
            godot-maquettes=${{ steps.godot-maquettes.outcome }}
            godot-export=${{ steps.godot-export.outcome }}
            godot-etalons=${{ steps.godot-etalons.outcome }}
            godot-recettes=${{ steps.godot-recettes.outcome }}
            godot-recettes-natives=${{ steps.godot-recettes-natives.outcome }}
            python-3d=${{ steps.python-3d.outcome }}
            personnage-3d-tout=${{ steps.personnage-3d-tout.outcome }}
            personnage-3d-portes=${{ steps.personnage-3d-portes.outcome }}
            arbre-inchange=${{ steps.arbre-inchange.outcome }}
            audit-stock=${{ steps.audit-stock.outcome }}
            fermetures=${{ steps.fermetures.outcome }}
        run: |
          ROUGES="$(printf '%s\n' "$RESULTATS" | grep -E '=(failure|cancelled)$' || true)"
          SKIPPES="$(printf '%s\n' "$RESULTATS" | grep -E '=skipped$' || true)"
          RAPPORT="$RUNNER_TEMP/canari-rapport.md"
          {
            echo "## Canari du $(date -u +%Y-%m-%d) — $RUN_URL"
            echo
            if [ -n "$ROUGES" ]; then
              echo "### Mesures ROUGES"
              printf '%s\n' "$ROUGES" | sed 's/^/- /'
            else
              echo "### Toutes les mesures sont vertes"
            fi
            if [ -n "$SKIPPES" ]; then
              echo
              echo "### Mesures NON JOUÉES (leur prérequis est rouge)"
              printf '%s\n' "$SKIPPES" | sed 's/^/- /'
            fi
            for f in "$RUNNER_TEMP"/canari/*; do
              [ -f "$f" ] || continue
              echo
              echo "<details><summary>$(basename "$f")</summary>"
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
              echo "</details>"
            done
          } > "$RAPPORT"
          cat "$RAPPORT"

          # Le canari se NOMME en rougissant : le signalement (label idempotent, issue survivante,
          # commentaire, fermeture sur vert) est le geste COMMUN à tout workflow sans porte, tenu par
          # un seul script — registre scripts/gates/workflowsDuDepot.mjs (#1779).
          node scripts/ops/signaler-rouge.mjs \
            --titre "Canari rouge — environnement ou suite cassés" \
            --prefixe "Canari rouge" \
            --label canari \
            --corps "$RAPPORT" \
            --verdict "$([ -n "$ROUGES" ] && echo rouge || echo vert)"

          if [ -n "$ROUGES" ]; then
            echo "canari ROUGE : $(printf '%s\n' "$ROUGES" | wc -l) mesure(s)" >&2
            exit 1
          fi
