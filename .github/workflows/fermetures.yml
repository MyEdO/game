name: Fermetures

# Un ticket se ferme quand son correctif est PUBLIÉ, jamais au commit local : AUCUN hook local ne
# ferme de ticket, c'est ce workflow qui le fait (#1685 avait été fermé par 8b52f3a55 avant que ce
# commit n'atteigne `main` — revue de palier n°3, 2026-09-04, écart 10). `main` n'avance que par la
# file de fusion (#2178) : le sha poussé est un commit de file, jugé par `ci.yml` sur `merge_group`.
# Aucun `needs:` possible vers ces jobs d'un autre événement : leurs check-runs se LISENT
# (scripts/ops/checks-requis.mjs), et aucun ticket ne se ferme s'ils ne sont pas tous verts.
on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  issues: write

jobs:
  fermetures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # L'histoire complète : le script lit les MESSAGES de la plage poussée et le solde que chaque
      # commit EMPORTE (`git show <sha>:.claude/soldes/<N>.md`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checks requis du sha poussé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: node scripts/ops/checks-requis.mjs
      - name: Fermer les tickets soldés par la plage poussée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$BEFORE" in *[!0]*) ;; *) BEFORE="$(git rev-parse "$SHA^")" ;; esac
          node scripts/ops/fermer-depuis-main.mjs "$BEFORE..$SHA"

      # Ce workflow n'est pas la porte : il se NOMME en rougissant — registre
      # scripts/gates/workflowsDuDepot.mjs (#1779). Le signaleur n'importe que `node:*`.
      - name: Se nommer en rougissant
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUT: ${{ job.status }}
          SHA: ${{ github.sha }}
        run: |
          RAPPORT="$RUNNER_TEMP/fermetures-rapport.md"
          echo "Run $RUN_URL sur $SHA : job \`$STATUT\` — rejouer à la main : \`npm run ops:fermer -- <before>..$SHA\`" > "$RAPPORT"
          node scripts/ops/signaler-rouge.mjs \
            --titre "Fermetures rouges" \
            --label canari \
            --corps "$RAPPORT" \
            --verdict "$([ "$STATUT" = success ] && echo vert || echo rouge)"
