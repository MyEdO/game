name: Fermetures

# Un ticket se ferme quand son correctif est PUBLIÉ, jamais au commit local : AUCUN hook local ne
# ferme de ticket, c'est ce workflow qui le fait (#1685 avait été fermé par 8b52f3a55 avant que ce
# commit n'atteigne `main` — revue de palier n°3, 2026-09-04, écart 10). `main` n'avance que par la
# file de fusion (#2178) : le sha poussé est un commit de file, jugé par `ci.yml` sur `merge_group`.
# Aucun `needs:` possible vers ces jobs d'un autre événement : leurs check-runs se LISENT
# (scripts/ops/checks-requis.mjs), et aucun ticket ne se ferme s'ils ne sont pas tous verts.
# La plage fermée part du dernier commit où ce workflow a RÉUSSI, pas de `event.before` : une course
# rouge, annulée ou jamais lancée est rattrapée par la suivante (#2155, `baseDeLaPlage`), dans la limite
# du plafond de recul — le dépasser est DIT par un `::warning::` ; des courses illisibles ROUGISSENT.
# Les courses se SÉRIALISENT (`concurrency`, sans annulation en vol) : deux courses ne traitent jamais
# le même ticket ensemble, et une course en attente annulée par GitHub est rattrapée par la suivante.
on:
  push:
    branches: [main]

concurrency:
  group: fermetures
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  actions: read
  issues: write

jobs:
  fermetures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # L'histoire complète : le script lit les MESSAGES de la plage, le solde que chaque commit
      # EMPORTE (`git show <sha>:.claude/soldes/<N>.md`) et les premiers parents de sa base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checks requis du sha poussé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: node scripts/ops/checks-requis.mjs
      - name: Fermer les tickets soldés depuis la dernière course réussie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node scripts/ops/fermer-depuis-main.mjs --rattraper "$BEFORE..$SHA"

      # Ce workflow n'est pas la porte : il se NOMME en rougissant — registre
      # scripts/gates/workflowsDuDepot.mjs (#1779). Le signaleur n'importe que `node:*`.
      - name: Se nommer en rougissant
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUT: ${{ job.status }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          PLAGE="$(node scripts/ops/fermer-depuis-main.mjs --plage "$BEFORE..$SHA")" || PLAGE="<plage non calculée, voir ce run>"
          RAPPORT="$RUNNER_TEMP/fermetures-rapport.md"
          echo "Run $RUN_URL sur $SHA : job \`$STATUT\` — rejouer à la main : \`npm run ops:fermer -- $PLAGE\`" > "$RAPPORT"
          node scripts/ops/signaler-rouge.mjs \
            --titre "Fermetures rouges" \
            --label canari \
            --corps "$RAPPORT" \
            --verdict "$([ "$STATUT" = success ] && echo vert || echo rouge)"
