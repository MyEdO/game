name: Exécutable de bureau

# L'exécutable de bureau de l'hôte Godot (#3951), fabriqué sur la plateforme qui le joue : `npm run godot:bureau`
# exporte le projet, embarque le noyau et son Node, dépose sous `licences/` l'avis de licence de chaque œuvre tierce
# embarquée (#4063, `hotes/godot/avis.mjs`), puis fait jouer une partie vivante à l'exécutable. Le dossier
# `dist/bureau` de chaque plateforme est l'artefact du run, à télécharger et à lancer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bureau:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/caches-3d
      - run: npm run godot:bureau
      - uses: actions/upload-artifact@v4
        with:
          name: bureau-${{ matrix.os }}
          path: dist/bureau
