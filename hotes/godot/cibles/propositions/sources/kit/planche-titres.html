<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche du kit : titres</title>
<link rel="stylesheet" href="../gestes.css">
<style>
/* La forme cible proposée du lot de nature « titres » (#4585) : locale à cette planche tant qu'elle n'est pas validée. */
.cible-ecran{font-size:31px;line-height:44px;margin:-6px 0 -5px;color:var(--ivoire);text-shadow:0 2px 3px var(--noir);white-space:nowrap}
.cible-panneau{font-size:28px;line-height:40px;margin:-7px 0 -5px;color:var(--ivoire);text-shadow:0 1px 2px var(--noir);white-space:nowrap}
.parchemin .cible-panneau{color:var(--sepia);text-shadow:none}
.cible-inter{font-size:13px;line-height:16px;color:var(--creme-2);white-space:nowrap}
.parchemin .cible-inter{color:var(--rouille)}
.cible-nom{color:var(--ivoire);white-space:nowrap}
.parchemin .cible-nom{color:var(--sepia)}
.cible-nom.grand{font-size:22px;line-height:30px}
.cible-nom.moyen{font-size:18px;line-height:24px}
.cible-nom.petit{font-size:16px;line-height:19px}
</style>
</head>
<body>
<div id="ecran" data-etat="titres"><svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="none"></svg><div id="ui"></div><div class="calque" id="grain"></div></div>
<script src="../gestes.js"></script>
<script src="planche.js"></script>
</body>
</html>
