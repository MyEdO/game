<title>Grisefosse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Open+Sans:wght@600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* Un écran de jeu plein cadre posé sur le kit des maquettes (`kit.css`) : la scène du lieu au fond, ses enseignes
   dessus, le cartouche en haut à gauche, Partir en haut à droite, la compagnie en bandeau, une page sur parchemin à
   droite pour ce qu'on ouvre. Les cadres du kit, placés en absolu sur 1280 × 720, suivent ici leurs conteneurs. */
html, body { height: 100%; background: #0d0b1e; color: var(--creme); color-scheme: dark; overflow: hidden; }
body { font: 16px/1.5 "Spectral", Georgia, serif; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or-eclat); outline-offset: 3px; }
.gothique { font-family: "Grenze Gotisch", serif; }
p { margin: 0; }
#jeu, .ecran { position: fixed; inset: 0; }
:root { --bandeau: 132px; --gouttiere-g: max(16px, env(safe-area-inset-left, 0px)); --gouttiere-d: max(16px, env(safe-area-inset-right, 0px)); }

/* le kit dans le flux */
.cadre { position: relative; padding: 9px; }
.cadre > .fond { height: auto; padding: 22px 18px 18px; }
.cadre > .fond:not(.parchemin) { background: radial-gradient(130% 120% at 50% 0%, rgba(59,39,24,.75), rgba(13,8,6,.94)); }
.ruban { font-family: "Grenze Gotisch", serif; font-weight: 600; }
button.plaque { border: 0; cursor: pointer; color: inherit; font: inherit; flex: none; }
button.plaque > div { width: 100%; }
button.plaque:hover:not(:disabled) > div { color: var(--or-eclat); box-shadow: inset 0 0 0 1px var(--filet-or-vif), inset 0 1px 0 var(--reflet); }
button.plaque.armee:hover:not(:disabled) > div { color: var(--encre); filter: brightness(1.06); }
button.plaque:disabled { cursor: not-allowed; }
.plaque .prix { margin-left: 10px; }
.parchemin { color: var(--encre); }
.parchemin .glose, .parchemin .sous-titre { color: var(--encre-2); }
.parchemin .nom-propre { color: var(--sepia); text-shadow: none; }
.lien { background: none; border: 0; padding: 4px 2px; font-family: "IM Fell English SC", serif; letter-spacing: 1px; color: var(--rouille); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.gestes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.gestes.colonne { flex-direction: column; align-items: stretch; }
.etats, .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.niveaux { display: inline-flex; gap: 5px; margin-top: 4px; }
.niveaux i { width: 9px; height: 9px; transform: rotate(45deg); box-shadow: inset 0 0 0 1px var(--trait-encre); }
.niveaux i.plein { background: linear-gradient(135deg, var(--or-eclat), var(--laiton)); box-shadow: 0 0 0 1px var(--laiton-ombre); }
.vie { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-family: "IM Fell English SC", serif; letter-spacing: .6px; color: var(--creme-2); }
.vie .chiffres { font-family: "Open Sans", sans-serif; letter-spacing: 0; color: var(--ivoire); }
.parchemin .vie { color: var(--encre-2); }
.parchemin .vie .chiffres { color: var(--encre); }

/* la scène : un panorama qui défile à l'horizontale quand l'écran est étroit */
.panorama { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; background: linear-gradient(180deg, #0d0b1e 55%, #110c17 85%, #060408); }
.panorama::-webkit-scrollbar { display: none; }
/* sur un écran de bureau, tout le village tient en largeur ; sur un écran étroit, il garde sa hauteur et défile */
.toile { position: absolute; left: 0; bottom: 40px; width: max(100vw, calc((100dvh - 200px) * 1600 / 720)); aspect-ratio: 1600 / 720; }
.toile::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 40px; background: #060408; }
.toile .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .bat { cursor: pointer; transition: filter .2s; }
.scene .bat:hover { filter: brightness(1.35) drop-shadow(0 0 10px rgba(255,190,110,.35)); }
.enseigne { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border: 0; border-radius: 3px; cursor: pointer; text-align: left;
  background: radial-gradient(130% 140% at 50% 0%, var(--chene), var(--chene-nuit) 80%); box-shadow: 0 6px 14px var(--ombre-forte), 0 0 0 1px var(--contour), inset 0 0 0 1px var(--filet-or); transition: transform .15s; white-space: nowrap; }
.enseigne::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: var(--chene-nuit); box-shadow: 1px 1px 0 var(--filet-or); }
.enseigne:hover, .enseigne.ouverte { transform: translate(-50%, -100%) translateY(-3px); box-shadow: 0 8px 18px var(--ombre-forte), 0 0 0 1px var(--contour), inset 0 0 0 1px var(--filet-or-vif), 0 0 16px var(--halo); }
.enseigne .nom { display: block; font-size: 17px; line-height: 1.1; color: var(--ivoire); }
.enseigne .sous { display: block; font: 11.5px "IM Fell English SC", serif; letter-spacing: 1px; color: var(--creme-2); }
.enseigne.ruine { background: radial-gradient(130% 140% at 50% 0%, var(--fer-mat), var(--fer-sombre) 80%); }
.enseigne.ruine .nom { color: var(--creme-2); }
.pastille-batir { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--or-eclat), var(--laiton)); box-shadow: 0 0 10px var(--halo-vif), 0 0 0 1px var(--laiton-ombre); animation: pouls 1.6s ease-in-out infinite; }
@keyframes pouls { 50% { transform: scale(1.25); } }

/* cartouche du lieu, en haut à gauche */
.cartouche-lieu { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: var(--gouttiere-g); width: min(380px, calc(100vw - 32px)); display: grid; gap: 10px; z-index: 3; }
.cartouche-lieu .fond { padding: 12px 14px; display: grid; gap: 10px; }
.cartouche { display: flex; align-items: center; gap: 12px; }
.cartouche .titre { font-size: 30px; line-height: 1.05; margin: 0; white-space: normal; }
.ressources { display: flex; flex-wrap: wrap; gap: 6px; }
.recit-lieu { font-style: italic; font-size: 15.5px; line-height: 1.45; color: var(--creme); max-width: 360px; }

/* coin droit : Partir, puis les outils */
.coin-droit { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: var(--gouttiere-d); width: 300px; display: grid; gap: 14px; z-index: 3; }
.partir { display: grid; gap: 10px; padding-top: 4px; }
.outils { display: flex; justify-content: flex-end; gap: 14px; }
.seul-etroit { display: none; }
.outil { background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 4px; }
.outil .bouton-rond { display: block; }
.outil .bouton-rond > span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, var(--chene), var(--chene-nuit) 70%); box-shadow: inset 0 0 0 1px var(--ombre-forte), inset 0 2px 5px var(--ombre-forte); }
.outil .libelle { font: 11.5px "IM Fell English SC", serif; letter-spacing: .7px; color: var(--creme); text-shadow: 0 1px 3px #000; }
.outil:hover .bouton-rond { box-shadow: 0 4px 8px var(--ombre-forte), 0 0 0 1px var(--contour), 0 0 12px var(--halo); }
.bandeau-victoire { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 36px; font-size: 26px; color: var(--ivoire); background: linear-gradient(180deg, var(--lie), var(--lie-sombre)); box-shadow: inset 0 0 0 1px var(--filet-or); clip-path: polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%); z-index: 3; }

/* bandeau de la compagnie */
.bandeau-heros { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(1180px, calc(100vw - 32px)); z-index: 4; }
.bandeau-heros .fond { padding: 10px; }
.rang-heros { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: thin; }
.carte-heros { flex: 1 0 236px; max-width: 290px; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border: 0; border-radius: 3px; cursor: pointer; text-align: left;
  background: linear-gradient(180deg, rgba(59,39,24,.5), rgba(27,16,10,.7)); box-shadow: inset 0 0 0 1px var(--filet-or); }
.carte-heros:hover, .carte-heros.choisi { box-shadow: inset 0 0 0 1px var(--filet-or-vif), 0 0 14px var(--halo); }
.carte-heros .qui { flex: 1; min-width: 0; display: grid; gap: 2px; }
.carte-heros .nom-propre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte-heros .ligne-etat { font-size: 12.5px; font-style: italic; color: var(--creme-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte-heros.hors .portrait > div { filter: grayscale(.8) brightness(.6); }
.carte-heros.hors .ligne-etat { color: var(--cire-clair); }
.vide { margin: 4px 8px; }

/* la page ouverte, sur parchemin */
.page { position: absolute; right: var(--gouttiere-d); top: max(14px, env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--bandeau) - 36px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100vw - 32px)); z-index: 5; display: flex; }
.page > .cadre { flex: 1; display: flex; min-height: 0; }
.page > .cadre > .fond { flex: 1; overflow-y: auto; display: grid; gap: 14px; align-content: start; padding-top: 30px; scrollbar-width: thin; }
.croix { position: absolute; top: 14px; right: 16px; z-index: 2; width: 30px; height: 30px; border: 0; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 28px; color: var(--or);
  background: radial-gradient(circle at 40% 30%, var(--chene), var(--chene-nuit) 70%); box-shadow: 0 2px 4px var(--ombre-forte), 0 0 0 1px var(--contour); }
.tete-page { display: flex; gap: 14px; align-items: center; }
.tete-page .qui { flex: 1; display: grid; gap: 3px; }
.glose.consigne { font-size: 16px; line-height: 1.45; }
.batir { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--filet-encre); }
.batir .plaque { justify-self: start; }
.cout { color: var(--rouille); font-weight: 600; }
.acheve { color: var(--vert); }
.liste-h, .destinations, .tombes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.liste-h li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 3px; background: var(--voile); box-shadow: inset 0 0 0 1px var(--filet-encre); }
.liste-h .qui, .tombes li { display: grid; min-width: 0; font-size: 13.5px; color: var(--encre-2); }
.liste-h .qui b, .tombes b { font-size: 17px; color: var(--sepia); font-weight: 600; }
.destinations li { display: grid; gap: 4px; padding: 10px 12px; border-radius: 3px; background: var(--voile); box-shadow: inset 0 0 0 1px var(--filet-encre); }
.destinations .detail { font: 12.5px "IM Fell English SC", serif; letter-spacing: .8px; color: var(--rouille); }
.destinations .plaque { justify-self: start; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 0; text-align: center; }
.stats div { padding: 4px 0 3px; border-radius: 2px; background: var(--voile-fort); box-shadow: inset 0 0 0 1px var(--filet-encre); }
.stats dt { font: 11.5px "IM Fell English SC", serif; letter-spacing: .8px; color: var(--rouille); }
.stats dd { margin: 0; font-size: 15px; color: var(--encre); }
.meta .glose { font-size: 13px; }
.gestes-h { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
/* L'écran du héros : la disposition de la fiche des maquettes (scène 1280 × 720, cadres fixes), règles de
   `heros/heros.css` du kit (`main`), polices remappées comme `kit.css`. */
.ecran-plein { position: fixed; inset: 0; z-index: 20; background: radial-gradient(120% 90% at 50% 30%, #2a1d14, #0d0907 70%); }
.scene-fixe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.place-cadre { position: absolute; display: flex; }
.place-cadre > .cadre { flex: 1; display: flex; min-height: 0; min-width: 0; }
.place-cadre > .cadre.bande > .fond { display: grid; overflow: visible; flex-direction: row; }
.place-cadre > .cadre.droite > .fond { padding-top: 34px; }
.droite .rub, .competences .rub { white-space: normal; }
.droite .talent .plaque { width: 84px; }
.place-cadre > .cadre > .fond { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.competences > .fond > .defile, .droite > .fond { overflow-y: auto; scrollbar-width: thin; }
.competences > .fond > .defile { flex: 1; min-height: 0; }
.ident > .fond { overflow-y: auto; scrollbar-width: thin; gap: 6px; }
.ident .pied { height: auto; margin-top: 8px; }
.trou { display: inline-grid; place-items: center; }
.trou.plein { border-color: var(--laiton); background: linear-gradient(180deg, var(--or-eclat), var(--or-moyen)); color: var(--encre); }
.bande .c { border: 0; background: none; font: inherit; color: inherit; padding-bottom: 0; }
button.c.carr { cursor: pointer; }
button.c.carr:hover:not(:disabled)::before { background: rgba(255,246,208,.85); }
button.c:disabled { cursor: default; opacity: .7; }
.bande .c.faite .aug { color: #4f6b2e; font-weight: 600; }
.rub.colonnes { display: flex; gap: 46px; margin-right: 38px; }
.socle > .fond { padding: 8px 10px; }
.socle .rang-heros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; height: 100%; }
.talent.acquis { background: rgba(201,161,74,.16); }
.gestes-ident { margin-top: auto; padding-top: 8px; }
@media (max-width: 899px) {
  .ecran-plein { overflow-y: auto; }
  .scene-fixe { position: static; width: auto; height: auto; transform: none !important; padding: 12px 0 24px; }
  .place-cadre { position: relative; left: auto !important; top: auto !important; width: auto !important; height: auto !important; margin: 0 16px 14px; }
  .place-cadre > .cadre > .fond { overflow: visible; }
  .place-cadre > .cadre.bande > .fond { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 6px; padding: 18px 6px 8px; }
  .socle .rang-heros { grid-template-columns: repeat(2, 1fr); }
  .ecran-plein .croix-ecran { position: fixed; left: auto; right: 16px; top: 12px; z-index: 3; }
}
.croix-ecran { position: absolute; left: 1206px; top: 22px; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; font-size: 26px; line-height: 1; color: var(--encre); background: linear-gradient(180deg, var(--or-eclat), var(--or-moyen) 55%, var(--laiton)); box-shadow: 0 3px 7px var(--ombre-forte), 0 0 0 2px var(--laiton-ombre); }
.pan>.fond{padding:15px 19px 14px}
.pan>.fond.bois{padding:14px 16px}
.pan:has(>.onglets)>.fond{padding-top:26px}
.pan .filet{margin:9px 26px}
.tete-l{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 5px}
.tete-l>.plaque{flex:none}
.pan .rub+.lignes,.pan .rub+.deux,.pan .rub+.trois{margin-top:3px}
.pan .lignes+.rub,.pan .deux+.rub,.pan .trois+.rub,.pan .tire+.rub{margin-top:10px}
:is(.ligne,.achat,.competence)>.etiquette.rectangle{width:32px;justify-content:center}
.val{flex:none;font-family:"Open Sans";font-size:14px;font-weight:600;color:var(--encre);min-width:24px;text-align:right}
.comptes{display:flex;align-items:center;gap:9px;margin-top:9px}
.trou{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--trait-encre);background:rgba(60,40,20,.08)}
.ident .tete{display:flex;gap:14px}
.ident .tete>.q{flex:1;min-width:0}
.ident .l{font-family:"IM Fell English SC";font-size:12.5px;line-height:19px;letter-spacing:1px;color:var(--rouille);white-space:nowrap}
.bourse-px{display:flex;align-items:center;gap:13px;margin-top:12px}
.bourse-px .px{flex:none;min-width:84px;height:48px;padding:3px;border-radius:26px;box-shadow:0 3px 7px var(--brou),0 0 0 1px var(--contour)}
.bourse-px .px>div{height:100%;border-radius:24px;display:grid;place-items:center;padding:0 14px;background:linear-gradient(180deg,var(--or-eclat),var(--or-moyen) 55%,var(--laiton));box-shadow:inset 0 0 0 1px var(--laiton-ombre),inset 0 1px 0 var(--reflet-vif);font-family:"Open Sans";font-size:22px;font-weight:600;color:var(--encre)}
.bourse-px b{display:block;font-family:"IM Fell English SC";font-weight:400;font-size:15px;line-height:20px;letter-spacing:1.1px;color:var(--sepia);white-space:nowrap}
.exigences{margin-top:3px}
.exige{display:flex;align-items:center;gap:9px;min-height:27px;padding:2px 0;font-family:"IM Fell English";font-size:14px;line-height:17px;color:var(--encre)}
.exige>span:not(.cpt){flex:1;min-width:0}
.exige .cpt{flex:none;font-size:12.5px;white-space:nowrap}
.ident .pied{display:flex;flex-direction:column;gap:7px;height:100%}
.bande>.fond{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));padding:0 6px}
.bande .c{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.bande .c+.c{border-left:1px solid var(--filet-encre)}
.bande .c .ab{font-family:"IM Fell English SC";font-size:12.5px;line-height:15px;letter-spacing:1px;color:var(--rouille)}
.bande .c .v{font-family:"Open Sans";font-size:23px;line-height:27px;color:var(--encre)}
.bande .c .aug{font-family:"Open Sans";font-size:10.5px;line-height:13px;color:var(--encre-2);height:13px}
.bande .c>.etiquette{margin-top:1px}
.bande .c.carr::before{content:"";position:absolute;inset:6px 3px 5px;border:2px solid var(--laiton);border-radius:3px;background:rgba(255,246,208,.45);box-shadow:0 0 0 1px var(--contour)}
.bande .c>*{position:relative}
.bande .c .v{margin-right:16px}
.bande .c .aug{position:absolute;top:32px;left:calc(50% + 9px);height:auto}
.achat{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 2px;border-bottom:1px solid var(--filet-encre);min-width:0}
.achat>.n{flex:1;min-width:0;overflow:hidden;font-family:"IM Fell English";font-size:14.5px;color:var(--encre);white-space:nowrap}
.achat>.n small{font-size:12.5px;color:var(--encre-2)}
.achat .aug{flex:none;width:26px;text-align:right;font-size:12px;color:var(--encre-2)}
.achat>.fait{flex:none;width:16px;display:grid;place-items:center;color:var(--encre-2)}
.achat .plaque{flex:none;width:64px}
.achat .val span{font-weight:400}
.achat.vise{border:2px solid var(--laiton);border-radius:3px;background:linear-gradient(180deg,rgba(255,246,208,.9),rgba(228,203,134,.8));box-shadow:0 0 0 1px var(--contour),0 2px 5px var(--brou)}
.achat .avertissement{margin-left:auto}
.achat.hors{border-bottom:0;color:var(--encre-2)}
.achat.hors>.n{color:var(--encre-2)}
.achat svg{flex:none}
.talent{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--filet-encre);border-radius:3px;background:rgba(255,246,218,.28);margin-top:7px}
.talent .t{flex:1;min-width:0}
.talent .t i{display:block;font-family:"IM Fell English SC";font-style:normal;font-size:10.5px;line-height:14px;letter-spacing:.8px;color:var(--rouille)}
.talent .plaque{flex:none;width:94px}
.talent.clos .nom-propre{color:rgba(42,29,18,.6)}
.droite .jauge { margin: 4px 0 2px; }
.droite .rub { margin-top: 9px; }
.droite .rub:first-child { margin-top: 0; }
.pied-equipement { margin-top: auto; padding-top: 10px; }
.cases-equipement { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.case-objet { display: grid; justify-items: center; gap: 3px; min-width: 0; }
.boite-objet { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 2px solid var(--laiton); border-radius: 4px; color: var(--sepia); font: inherit; background: radial-gradient(90% 80% at 50% 35%, rgba(255,246,208,.95), rgba(228,203,134,.85)); box-shadow: 0 0 0 1px var(--contour), 0 2px 5px var(--brou); }
.case-objet.grande .boite-objet { width: 64px; height: 64px; }
button.boite-objet { cursor: pointer; }
button.boite-objet:hover:not(:disabled) { box-shadow: 0 0 0 1px var(--contour), 0 0 10px var(--halo-vif); }
