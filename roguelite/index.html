<title>Grisefosse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans+SC:wght@500;700&family=UnifrakturMaguntia&display=swap">
<style>
/* Mise en page : un registre de compagnie tenu à la lanterne. Bandeau des ressources, puis des blocs empilés ;
   le combat s'ouvre par-dessus, en plateau de cases. Thème sombre assumé, couleurs posées explicitement. */
:root {
  color-scheme: dark;
  --suie: #17150f;       /* fond : bois brûlé */
  --tourbe: #221f17;     /* surfaces */
  --tourbe-2: #2d291e;   /* surfaces relevées */
  --trait: #4a4232;      /* filets */
  --velin: #e9dfc6;      /* texte */
  --velin-2: #b4a785;    /* texte secondaire */
  --laiton: #c9a14a;     /* accent : laiton des lanternes */
  --sang: #a8382a;       /* blessures, ennemis */
  --mousse: #6f8a4a;     /* soins, gains */
  --f-titre: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
  --f-texte: "Alegreya", Georgia, "Times New Roman", serif;
  --f-etiq: "Alegreya Sans SC", "Alegreya", Georgia, sans-serif;
  --r: 3px;
}
* { box-sizing: border-box; }
html, body { background: var(--suie); color: var(--velin); }
body { font: 16px/1.5 var(--f-texte); padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font: 700 15px/1.2 var(--f-etiq); letter-spacing: .12em; text-transform: uppercase; color: var(--laiton); display: flex; align-items: baseline; gap: 10px; }
h2 .repos { margin-left: auto; font: 400 14px var(--f-texte); letter-spacing: 0; text-transform: none; }
h2 small { font: 400 14px var(--f-texte); letter-spacing: 0; text-transform: none; color: var(--velin-2); }
h3 { font-size: 18px; }
p { margin: 0; }
button { font: 600 14px var(--f-texte); color: var(--velin); background: var(--tourbe-2); border: 1px solid var(--trait); border-radius: var(--r); padding: 7px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--laiton); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--laiton); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.principal { background: var(--laiton); color: var(--suie); border-color: var(--laiton); }
button.principal:hover:not(:disabled) { filter: brightness(1.08); }
button.danger { background: var(--sang); border-color: var(--sang); }
button.discret { background: none; border-color: transparent; color: var(--velin-2); text-decoration: underline; text-underline-offset: 3px; }
.sous { color: var(--velin-2); font-size: 14px; }
.vide { color: var(--velin-2); font-style: italic; }

/* Bandeau */
.tete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--suie); border-bottom: 1px solid var(--trait); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 14px 12px; margin-bottom: 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--suie); }
.tete h1 { font: 400 40px/1 var(--f-titre); color: var(--velin); }
.tete h1 span { display: block; font: 500 13px var(--f-etiq); letter-spacing: .14em; color: var(--velin-2); margin-top: 4px; }
#ressources { display: flex; gap: 18px; font: 500 15px var(--f-etiq); letter-spacing: .06em; color: var(--velin-2); font-variant-numeric: tabular-nums; }
#ressources b { color: var(--laiton); font-size: 20px; margin-right: 3px; }

.bloc { display: grid; gap: 14px; margin-bottom: 34px; }
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr)); }
.deux { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.bandeau { border: 1px solid var(--laiton); color: var(--laiton); padding: 14px 18px; margin-bottom: 28px; font-size: 18px; }
.pied { text-align: center; }

/* Héros */
.heros { background: var(--tourbe); border: 1px solid var(--trait); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.heros.hors { border-color: var(--sang); }
.heros header { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.blason { width: 42px; height: 48px; display: grid; place-items: center; font: 700 16px var(--f-etiq); color: var(--suie); background: var(--laiton); clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.blason.petit { width: 34px; height: 40px; font-size: 13px; }
.heros.hors .blason { background: var(--sang); color: var(--velin); }
.destin { text-align: center; line-height: 1; }
.destin b { font-size: 22px; color: var(--laiton); display: block; }
.destin small { font: 500 11px var(--f-etiq); letter-spacing: .08em; color: var(--velin-2); }
.barre { position: relative; height: 20px; background: #3a1712; border-radius: 2px; overflow: hidden; }
.barre i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#b6513c, var(--sang)); transition: width .3s; }
.barre span { position: relative; display: block; text-align: center; font: 600 12px/20px var(--f-etiq); letter-spacing: .05em; color: var(--velin); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin: 0; text-align: center; }
.stats div { background: var(--tourbe-2); padding: 3px 0; }
.stats dt { font: 500 11px var(--f-etiq); letter-spacing: .06em; color: var(--velin-2); }
.stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.etats { display: flex; flex-wrap: wrap; gap: 4px; }
.etat { font: 500 12px var(--f-etiq); letter-spacing: .04em; border: 1px solid var(--sang); color: #e2a090; padding: 1px 6px; border-radius: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--velin-2); }
.meta span:first-child { color: var(--laiton); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Bâtiments */
.batiment { border-top: 2px solid var(--trait); padding-top: 10px; display: grid; gap: 6px; align-content: start; }
.batiment header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.role { font: 500 12px var(--f-etiq); letter-spacing: .1em; color: var(--velin-2); text-transform: uppercase; }
.effet { font-size: 15px; min-height: 2.9em; }
.niveaux { display: inline-flex; gap: 3px; }
.niveaux i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--laiton); }
.niveaux i.plein { background: var(--laiton); }
.batiment button { display: grid; gap: 2px; text-align: left; width: 100%; }
.batiment button span { font-weight: 400; color: var(--velin-2); font-size: 13px; }
.batiment button b { color: var(--laiton); }
.batiment button.pauvre b { color: var(--velin-2); }
.complet { font: 500 13px var(--f-etiq); letter-spacing: .1em; color: var(--mousse); }

/* Relais, chronique, tombes */
.liste { display: grid; gap: 8px; }
.candidat { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--tourbe); border: 1px solid var(--trait); border-radius: var(--r); padding: 8px 10px; }
.candidat .qui { min-width: 0; }
.chronique { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; color: var(--velin-2); }
.chronique li:first-child { color: var(--velin); }
.tombes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; columns: 2 300px; color: var(--velin-2); font-size: 14px; }
.tombes b { color: var(--velin); }

/* Destinations */
.destination { background: var(--tourbe); border: 1px solid var(--trait); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; }
.destination h3 { font: 400 24px/1.1 var(--f-titre); }
.destination button { justify-self: start; margin-top: 4px; }
.destination.vaincue h3::after { content: " · purgée"; font: 500 13px var(--f-etiq); letter-spacing: .08em; color: var(--mousse); }
.destination.fermee { background: none; border-style: dashed; color: var(--velin-2); }
.destination.fermee h3 { font: 600 17px var(--f-texte); }

/* Expédition */
.expe { background: var(--tourbe); border: 1px solid var(--trait); border-radius: var(--r); padding: 18px; }
.expe h2 { font: 400 32px/1 var(--f-titre); letter-spacing: 0; text-transform: none; color: var(--velin); }
.piste { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0; counter-reset: s; }
.piste li { flex: 1 1 90px; position: relative; padding: 22px 4px 0; text-align: center; font: 500 13px var(--f-etiq); letter-spacing: .06em; color: var(--velin-2); }
.piste li::before { content: ""; position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: var(--trait); }
.piste li::after { content: ""; position: absolute; top: 2px; left: calc(50% - 7px); width: 14px; height: 14px; transform: rotate(45deg); background: var(--suie); border: 2px solid var(--trait); }
.piste li.faite { color: var(--velin); }
.piste li.faite::after { background: var(--trait); }
.piste li.ici { color: var(--laiton); }
.piste li.ici::after { border-color: var(--laiton); background: var(--laiton); }
.piste li.boss::after { width: 18px; height: 18px; top: 0; left: calc(50% - 9px); border-color: var(--sang); }
.butin { display: flex; flex-wrap: wrap; gap: 20px; font: 500 14px var(--f-etiq); letter-spacing: .05em; color: var(--velin-2); }
.butin b { color: var(--laiton); font-size: 18px; }
.salle { border-top: 1px solid var(--trait); padding-top: 14px; display: grid; gap: 10px; }

/* Modales */
.modale { position: fixed; inset: 0; z-index: 20; background: rgb(10 9 6 / .78); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.boite { background: var(--tourbe); border: 1px solid var(--laiton); border-radius: var(--r); padding: 22px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px; }
.boite h2 { font: 400 30px/1 var(--f-titre); letter-spacing: 0; text-transform: none; color: var(--velin); }
.recit.defaite { border-color: var(--sang); }
.recit.succes h2 { color: var(--laiton); }
.choix { display: grid; gap: 8px; }
.choix label { display: grid; grid-template-columns: auto 1fr minmax(110px, 40%); gap: 10px; align-items: center; background: var(--tourbe-2); padding: 8px 10px; border-radius: var(--r); cursor: pointer; }
.choix label.hors { opacity: .5; cursor: not-allowed; }
.choix input { width: 18px; height: 18px; accent-color: var(--laiton); }
.entrainement { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.entrainement th { font: 500 12px var(--f-etiq); letter-spacing: .08em; color: var(--velin-2); text-align: left; padding: 4px; }
.entrainement td { padding: 5px 4px; border-top: 1px solid var(--trait); }

/* Combat */
#combat { position: fixed; inset: 0; z-index: 30; background: var(--suie); overflow: auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.arene-cadre { max-width: 1000px; margin: 0 auto; display: grid; gap: 12px; }
.arene-cadre header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.arene-cadre header h2 { font: 400 30px/1 var(--f-titre); letter-spacing: 0; text-transform: none; color: var(--velin); }
#round { font: 500 15px var(--f-etiq); letter-spacing: .1em; color: var(--laiton); }
.vitesse { margin-left: auto; display: flex; gap: 4px; }
.vitesse button.actif { border-color: var(--laiton); color: var(--laiton); }
.arene-corps { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 240px; align-items: start; }
.arene-zone { overflow-x: auto; min-width: 0; }
.effectifs { display: grid; gap: 6px; }
.effectifs h3 { font: 700 12px var(--f-etiq); letter-spacing: .12em; text-transform: uppercase; color: var(--laiton); margin-top: 4px; }
.effectifs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; }
.effectifs li { display: grid; gap: 2px; font-size: 13px; }
.effectifs li.hors { opacity: .45; }
.effectifs li.hors span::after { content: " · hors de combat"; color: var(--velin-2); }
.effectifs .barre { height: 14px; }
.effectifs .barre span { font-size: 10px; line-height: 14px; }
.barre.ennemie i { background: linear-gradient(#8a8a6a, #5d5d45); }
.arene { --c: clamp(24px, calc((min(740px, 100vw) - 40px) / var(--w)), 52px); position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--c)); grid-auto-rows: var(--c); width: max-content; margin: 0 auto; background: #2a2a1a; border: 2px solid var(--trait); }
.arene > i { border: 1px solid rgb(0 0 0 / .18); background: radial-gradient(circle at 30% 30%, #3a3a22, #2b2b1b); }
.pions { position: absolute; inset: 0; }
.pion { position: absolute; width: calc(var(--n, 1) * var(--c)); height: calc(var(--n, 1) * var(--c)); left: calc(var(--x) * var(--c)); top: calc(var(--y) * var(--c)); transition: left .35s ease, top .35s ease, opacity .4s; display: grid; place-items: center; }
.pion b { width: 76%; height: 76%; border-radius: 50%; display: grid; place-items: center; font: 700 calc(var(--n, 1) * var(--c) * .3) var(--f-etiq); border: 2px solid; box-shadow: 0 2px 0 rgb(0 0 0 / .5); }
.pion.camp-heros b { background: var(--laiton); color: var(--suie); border-color: #f1d488; }
.pion.camp-ennemi b { background: var(--sang); color: var(--velin); border-color: #e07a62; }
.pion .pv { position: absolute; left: 10%; right: 10%; bottom: 1px; height: 4px; background: #3a1712; }
.pion .pv i { display: block; height: 100%; background: var(--mousse); transition: width .3s; }
.pion.camp-ennemi .pv i { background: #e07a62; }
.pion.hors { opacity: .4; filter: grayscale(1); }
.pion.touche b { animation: secousse .35s; }
@keyframes secousse { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.degat { position: absolute; top: -4px; font: 800 calc(var(--c) * .36) var(--f-texte); text-shadow: 0 1px 2px #000; animation: monte 1.1s forwards; pointer-events: none; }
.degat.perte { color: #ff8a70; }
.degat.gain { color: #a8d27a; }
@keyframes monte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.journal { margin: 0; padding: 10px 14px; list-style: none; height: 190px; overflow-y: auto; background: var(--tourbe); border: 1px solid var(--trait); font-size: 14px; display: grid; align-content: start; gap: 3px; color: var(--velin-2); white-space: pre-line; }
.journal li.rouge { color: #e2a090; }
.journal li.fort { color: var(--laiton); font-weight: 700; }
.arene-cadre footer { text-align: center; min-height: 40px; }

#toast { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tourbe-2); border: 1px solid var(--laiton); padding: 10px 16px; border-radius: var(--r); max-width: calc(100% - 32px); }
#chargement { padding: 60px 0; text-align: center; color: var(--velin-2); font-style: italic; }

@media (prefers-reduced-motion: reduce) { .pion, .barre i, .pion .pv i { transition: none; } .pion.touche b, .degat { animation: none; } }
@media (max-width: 760px) { .arene-corps { grid-template-columns: 1fr; } .effectifs { grid-template-columns: 1fr 1fr; column-gap: 14px; } .effectifs h3:nth-of-type(2) { grid-row: 1; grid-column: 2; } .effectifs ul[data-camp="ennemi"] { grid-column: 2; grid-row: 2; } }
@media (max-width: 520px) { .tete h1 { font-size: 32px; } .choix label { grid-template-columns: auto 1fr; } .choix label .barre { grid-column: 1 / -1; } }
</style>
<div class="page">
  <header class="tete"><h1>Grisefosse<span>Compagnie franche du Reikland</span></h1><div id="ressources"></div></header>
  <main id="vue"><p id="chargement">Le noyau de règles se charge…</p></main>
</div>
<div id="modale"></div>
<div id="combat" hidden></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="jeu.js"></script>
