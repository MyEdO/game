<title>Grisefosse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=IM+Fell+English+SC&family=Open+Sans:wght@600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* Mise en page du jeu, posée sur le kit des maquettes (`kit.css`) : ses jetons de teinte, ses matières, ses pièces.
   Les cadres du kit sont placés en absolu sur un écran de 1280 × 720 ; ici ils suivent le flux de la page. */
html, body { background: var(--lit); color: var(--creme); color-scheme: dark; }
body { font: 16px/1.5 "Spectral", Georgia, serif; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(120% 80% at 50% 0%, var(--chene-nuit), var(--lit) 70%); background-attachment: fixed; }
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 30px; }
#vue { display: grid; gap: 34px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or-eclat); outline-offset: 3px; }
.gothique { font-family: "Grenze Gotisch", serif; }

/* le kit dans le flux */
.cadre { position: relative; padding: 9px; }
.cadre > .fond { height: auto; padding: 26px 20px 20px; }
.cadre > .fond.parchemin { color: var(--encre); }
.cadre > .fond:not(.parchemin) { background: radial-gradient(130% 120% at 50% 0%, rgba(59,39,24,.55), rgba(13,8,6,.9)); }
.ruban { font-family: "Grenze Gotisch", serif; font-weight: 600; }
button.plaque { border: 0; cursor: pointer; color: inherit; font: inherit; flex: none; }
button.plaque > div { width: 100%; }
button.plaque:hover:not(:disabled) > div { color: var(--or-eclat); box-shadow: inset 0 0 0 1px var(--filet-or-vif), inset 0 1px 0 var(--reflet); }
button.plaque.armee:hover:not(:disabled) > div { color: var(--encre); filter: brightness(1.06); }
button.plaque:disabled { cursor: not-allowed; }
.plaque .prix { margin-left: 10px; }
.plaque > div > span:first-of-type { overflow: hidden; text-overflow: ellipsis; }
.parchemin .glose, .parchemin .sous-titre { color: var(--encre-2); }
.parchemin .nom-propre { color: var(--sepia); text-shadow: none; }
.portrait > .initiale { width: 100%; height: 100%; display: grid; place-items: center; font-size: 20px; color: var(--ivoire); background: radial-gradient(90% 80% at 50% 28%, var(--ennemi-clair), var(--ennemi) 60%, var(--ennemi-sombre)); }
.lien { background: none; border: 0; padding: 4px 2px; font-family: "IM Fell English SC", serif; letter-spacing: 1px; color: var(--creme-2); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.lien:hover { color: var(--or-eclat); }
.gestes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.gestes .plaque { flex: 0 1 auto; }
.etats, .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vide { margin: 0; }
p { margin: 0; }

/* bandeau du hameau : l'illustration du kit, la ville au crépuscule */
.bandeau { position: relative; min-height: 210px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 30px max(16px, env(safe-area-inset-left, 0px)) 22px;
  background: url(hameau.jpg) center bottom / cover no-repeat, var(--chene-nuit); display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.bandeau::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,0) 45%, rgba(13,8,6,.85) 100%); pointer-events: none; }
.bandeau > * { position: relative; }
.bandeau h1 { margin: 0; font: 600 64px/0.95 "Grenze Gotisch", serif; letter-spacing: .5px; color: var(--or-eclat); background: linear-gradient(180deg, var(--ivoire), var(--or) 55%, var(--or-moyen)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 3px 4px rgba(0,0,0,.8)); }
.bandeau.en-route { background: url(bivouac.jpg) center 62% / cover no-repeat, var(--chene-nuit); min-height: 240px; }
.bandeau.en-route h1 { font-size: 52px; }
.bandeau .sous-titre { margin-top: 6px; font-size: 14px; letter-spacing: 2px; color: var(--creme); text-shadow: 0 1px 3px #000; }
#ressources { display: flex; gap: 8px; flex-wrap: wrap; }
#ressources .etiquette { height: 26px; font-size: 13.5px; padding: 0 12px; }

/* rangées */
.rangee { display: grid; gap: 22px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.grille { display: grid; gap: 16px; }
.heros-liste { grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
.batiments { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px 26px; }
.deux { display: grid; gap: 30px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }

/* destinations */
.destination { display: grid; gap: 10px; align-content: start; }
.destination .plaque { justify-self: start; margin-top: 6px; }
.destination.fermee { grid-template-columns: auto 1fr; align-items: center; gap: 14px; }

/* héros */
.barre-compagnie { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.heros-carte { display: grid; gap: 12px; align-content: start; padding: 12px; background: linear-gradient(180deg, rgba(59,39,24,.45), rgba(27,16,10,.6)); border-radius: 3px; box-shadow: 0 0 0 1px var(--filet-or), inset 0 0 18px var(--ombre); min-width: 0; }
.heros-carte.hors { box-shadow: 0 0 0 1px var(--cire), inset 0 0 18px var(--ombre); }
.heros-carte.hors .portrait > div { filter: grayscale(.8) brightness(.7); }
.tete-h { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.tete-h .qui { min-width: 0; display: grid; gap: 3px; }
.tete-h .nom-propre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vie { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; font-size: 12.5px; }
.vie .rubrique { font-family: "IM Fell English SC", serif; font-size: 12px; color: var(--creme-2); }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 0; text-align: center; }
.stats div { padding: 4px 0 3px; background: var(--lit); border-radius: 2px; box-shadow: inset 0 0 0 1px var(--filet-or); }
.stats dt { font-family: "IM Fell English SC", serif; font-size: 11.5px; letter-spacing: .8px; color: var(--creme-2); }
.stats dd { margin: 0; font-size: 15px; color: var(--ivoire); font-variant-numeric: tabular-nums; }
.meta .glose { font-size: 13px; }

/* relais */
.liste { display: grid; gap: 10px; }
.candidat { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 3px; background: rgba(27,16,10,.55); box-shadow: 0 0 0 1px var(--filet-or); }
.candidat .qui { min-width: 0; }

/* chronique, sur parchemin */
.chronique { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14.5px; line-height: 1.45; }
.chronique li { padding-left: 14px; border-left: 1px solid var(--filet-encre); color: var(--encre-2); }
.chronique li:first-child { color: var(--encre); }

/* bâtiments */
.batiment { display: grid; gap: 8px; align-content: start; }
.tete-b { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.batiment > .glose { font-size: 14.5px; line-height: 1.45; min-height: 2.9em; color: var(--creme); font-style: italic; }
.suite-b { display: grid; gap: 6px; padding-top: 8px; border-top: 1px solid var(--filet-creme); }
.suite-b p { font-size: 14px; color: var(--creme-2); }
.suite-b .plaque { justify-self: start; }
.acheve { color: var(--vert-clair); }

/* tombes */
.tombes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; columns: 2 320px; }
.tombes .gothique { font-size: 18px; color: var(--ivoire); }
.pied { text-align: center; }

/* expédition */
.titre-expe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.titre-expe .titre { font-size: 36px; line-height: 1.1; margin: 0; white-space: normal; }
.butin { display: flex; gap: 8px; flex-wrap: wrap; }
.piste { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; position: relative; }
.piste::before { content: ""; position: absolute; left: 6%; right: 6%; top: 27px; height: 2px; background: var(--filet-or); }
.piste li { position: relative; display: grid; justify-items: center; gap: 6px; flex: 1 1 70px; }
.piste li .medaillon.moyen { margin-top: 7px; }
.piste li.ici .sous-titre { color: var(--or-eclat); }
.piste li.ici .medaillon { box-shadow: 0 3px 6px var(--ombre-forte), 0 0 18px var(--halo-vif); }
.salle { display: grid; gap: 14px; }
.suite-b .cout { color: var(--or); font-size: 14px; }
.candidat .glose { font-size: 13px; }
.illustration { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; object-position: center 70%; border-radius: 2px; box-shadow: 0 0 0 1px var(--trait-encre), 0 4px 10px var(--ombre); }
.salle .glose.consigne { font-size: 18px; }

/* fenêtres */
.modale { position: fixed; inset: 0; z-index: 20; background: rgba(5,3,2,.78); display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.boite { width: min(620px, 100%); max-height: calc(100% - 10px); display: flex; flex-direction: column; }
.boite > .fond { overflow: auto; display: grid; gap: 14px; padding-top: 30px; }
.choix { display: grid; gap: 8px; }
.choix label { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: center; padding: 6px 10px; border-radius: 3px; background: var(--voile); box-shadow: inset 0 0 0 1px var(--filet-encre); cursor: pointer; }
.choix label.coche { background: var(--voile-fort); box-shadow: inset 0 0 0 1px var(--trait-encre); }
.choix label.hors { opacity: .45; cursor: not-allowed; }
.choix input { width: 18px; height: 18px; accent-color: var(--cire); }
.choix .qui { display: grid; }
.choix .qui b { font-size: 18px; color: var(--sepia); font-weight: 600; }
.choix .qui .sous { font-size: 13.5px; color: var(--encre-2); }
.entrainement { width: 100%; border-collapse: collapse; font-size: 15px; }
.entrainement th { font: 12.5px "IM Fell English SC", serif; letter-spacing: 1px; color: var(--rouille); text-align: left; padding: 4px; }
.entrainement td { padding: 5px 4px; border-top: 1px solid var(--filet-encre); }
.entrainement .plaque { width: 130px; }
.recit { display: grid; gap: 8px; font-size: 16px; }
.recit.defaite p:first-child { color: var(--sang); }
.issue-finale { text-align: center; padding: 22px; background: linear-gradient(180deg, var(--lie), var(--lie-sombre)); box-shadow: inset 0 0 0 1px var(--filet-or), 0 6px 18px var(--ombre); }
.issue-finale .gothique { font-size: 36px; color: var(--ivoire); }

/* combat */
#combat { position: fixed; inset: 0; z-index: 30; overflow: auto; background: radial-gradient(120% 90% at 50% 0%, var(--chene-nuit), var(--lit) 70%);
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.arene-cadre { max-width: 1060px; margin: 0 auto; display: grid; gap: 16px; }
.arene-cadre > header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.arene-cadre > header .titre { font-size: 34px; line-height: 1.1; margin: 0; }
.vitesse { margin-left: auto; display: flex; gap: 6px; }
.vitesse .plaque { min-width: 52px; }
.arene-corps { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 260px; align-items: start; }
.plateau > .fond, .panneau-eff > .fond { padding: 12px; }
.arene-zone { overflow-x: auto; }
.arene { --c: clamp(24px, calc((min(760px, 100vw) - 64px) / var(--w)), 52px); position: relative; display: grid; grid-template-columns: repeat(var(--w), var(--c)); grid-auto-rows: var(--c); width: max-content; margin: 0 auto;
  background: var(--vert-sombre); background-image: var(--tex-parchemin); background-blend-mode: multiply; box-shadow: inset 0 0 30px var(--ombre-forte); }
.arene > i { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35); background: radial-gradient(circle at 35% 30%, rgba(134,163,90,.18), rgba(15,35,8,.25)); }
.pions { position: absolute; inset: 0; }
.pion { position: absolute; width: calc(var(--n, 1) * var(--c)); height: calc(var(--n, 1) * var(--c)); left: calc(var(--x) * var(--c)); top: calc(var(--y) * var(--c)); transition: left .35s ease, top .35s ease, opacity .4s; display: grid; place-items: center; }
.pion .disque { width: 86%; height: 86%; border-radius: 50%; padding: 2px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 3px 5px var(--ombre-forte), 0 0 0 1px var(--contour); }
.pion .disque > svg, .pion .disque > b { width: 100%; height: 100%; border-radius: 50%; }
.pion .disque > b { display: grid; place-items: center; font-size: calc(var(--n, 1) * var(--c) * .4); color: var(--ivoire); }
.pion.camp-heros .disque { background: linear-gradient(135deg, var(--laiton-ombre), var(--laiton) 22%, var(--or-eclat) 45%, var(--or-moyen) 62%, var(--laiton-ombre)); }
.pion.camp-heros .disque > svg { background: radial-gradient(90% 80% at 50% 28%, var(--toile-clair), var(--toile) 62%, var(--toile-sombre)); fill: var(--buste); }
.pion.camp-ennemi .disque { background: linear-gradient(135deg, var(--fer-clair), var(--fer-sombre) 40%, var(--fer-eclat) 55%, var(--fer-sombre)); }
.pion.camp-ennemi .disque > svg, .pion.camp-ennemi .disque > b { background: radial-gradient(90% 80% at 50% 28%, var(--ennemi-clair), var(--ennemi) 60%, var(--ennemi-sombre)); fill: var(--buste-ennemi); }
.pion .disque .s { fill: var(--chevelure); }
.pion .disque .c { fill: var(--creme); }
.pion .pv { position: absolute; left: 12%; right: 12%; bottom: 0; height: 4px; background: var(--lit); box-shadow: 0 0 0 1px var(--contour); }
.pion .pv i { display: block; height: 100%; background: linear-gradient(180deg, var(--cire-clair), var(--sang)); transition: width .3s; }
.pion.hors { opacity: .4; filter: grayscale(1); }
.pion.touche .disque { animation: secousse .35s; }
@keyframes secousse { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.degat { position: absolute; top: -6px; font-size: calc(var(--c) * .4); text-shadow: 0 1px 2px #000, 0 0 6px #000; animation: monte 1.1s forwards; pointer-events: none; }
.degat.perte { color: #ff9a80; }
.degat.gain { color: var(--vert-clair); }
@keyframes monte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.effectifs { display: grid; gap: 8px; }
.effectifs ul { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 8px; align-content: start; }
.effectifs .rang { gap: 10px; }
.effectifs .rang .qui { flex: 1; display: grid; gap: 3px; }
.effectifs .rang .nom { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.effectifs .rang.hors { opacity: .45; }
.effectifs .pv-t { font-size: 11px; color: var(--creme-2); }
.panneau-journal > .fond { padding: 14px 18px; }
.journal { margin: 0; padding: 0; list-style: none; height: 180px; overflow-y: auto; display: grid; align-content: start; gap: 3px; font-size: 14.5px; line-height: 1.4; color: var(--encre-2); white-space: pre-line; }
.journal li.rouge { color: var(--sang); }
.journal li.fort { color: var(--encre); font-family: "Grenze Gotisch", serif; font-size: 20px; }
#combat-fin-place { display: flex; justify-content: center; min-height: 52px; }
#combat-fin-place .plaque { width: min(360px, 100%); }

#toast { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 3px; color: var(--encre);
  background: var(--parchemin); background-image: var(--tex-parchemin); background-blend-mode: multiply; box-shadow: 0 8px 20px var(--ombre-forte), inset 0 0 0 1px var(--trait-encre); }
#chargement { padding: 60px 0; text-align: center; font-style: italic; color: var(--creme-2); }

@media (prefers-reduced-motion: reduce) { .pion, .pion .pv i { transition: none; } .pion.touche .disque, .degat { animation: none; } }
@media (max-width: 760px) { .arene-corps { grid-template-columns: 1fr; } .effectifs { grid-template-columns: 1fr 1fr; column-gap: 14px; } .effectifs .sous-titre:nth-of-type(2) { grid-row: 1; grid-column: 2; } .effectifs ul[data-camp="ennemi"] { grid-column: 2; grid-row: 2; } }
@media (max-width: 520px) { .bandeau h1 { font-size: 46px; } .bandeau { min-height: 170px; } .candidat { grid-template-columns: auto 1fr; } .candidat .plaque { grid-column: 1 / -1; } .vitesse { margin-left: 0; } }
</style>
<div class="page">
  <header class="bandeau"><div><h1 id="titre">Grisefosse</h1><div class="sous-titre" id="sous-titre">Compagnie franche du Reikland</div></div><div id="ressources"></div></header>
  <main id="vue"><p id="chargement">Le noyau de règles se charge…</p></main>
</div>
<div id="modale"></div>
<div id="combat" hidden></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="jeu.js"></script>
