# Filtres RTK locaux au projet (précédence sur ~/.config/rtk et les filtres embarqués).
# Contexte : le `buildStart` du plugin Vite de `vite.config.ts` (gen-registry), que chaque run vitest
# déclenche, imprime ~100 lignes de pretest qui
# font échouer le parseur vitest embarqué de rtk → PASSTHROUGH tronqué EN TÊTE (le résumé
# pass/fail — la seule chose qui compte — était perdu, cf. mémoire « RTK masque pass/fail »).
schema_version = 1

[filters.vitest-foundry]
description = "vitest (Foundry/Game) : strip le bruit gen-registry/pretest, garde échecs + résumé"
match_command = "vitest"
strip_ansi = true
strip_lines_matching = [
  "^gen-registry:",
  "^\\s*$",
  "^\\s*✓",
  "^\\s*·",
  "(transform|setup|collect|environment|prepare)\\s+[\\d.]+m?s",
]
keep_lines_matching = [
  "Test Files",
  "^\\s*Tests\\s",
  "Duration",
  "FAIL|✕|×|→|Error|error TS",
  "PASS",
]
tail_lines = 60
on_empty = "vitest: sortie vide après filtrage — relire le log tee"
